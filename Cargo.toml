[package]
name = "mod-motion-blur"
version = "0.1.4"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK, fetched into .sunrise/sdk/ by `cargo sunrise-mod`; the launcher builds against
# its own copy of the same build.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
motion-blur-core = { path = "src/core" }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }

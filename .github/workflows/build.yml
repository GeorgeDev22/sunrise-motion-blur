name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries the game links
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Test the core
        run: cargo test --manifest-path src/core/Cargo.toml

      - name: Install cargo-sunrise-mod
        run: |
          set -eu
          base=https://github.com/sunrise-org/sunrise/releases/download
          key=r53xb3cuafGxZSicLz06KC+xXp9NJdPH8snNmXo5pAc=
          tool=tool-x86_64-unknown-linux-gnu.tar.xz
          build=$(sed -n 's/^sunrise = "\([0-9a-f]\{40\}\)"/\1/p' sunrise-mod.toml)

          # Installs the tool from a release, once Sunrise's key has signed its checksums.
          install_from() {
            work=$(mktemp -d)
            ( cd "$work"
              curl -fsSLO "$base/$1/$tool"
              curl -fsSLO "$base/$1/SHA256SUMS"
              curl -fsSLO "$base/$1/SHA256SUMS.sig"
              printf 'horizon release %s\n' "$1" | cat - SHA256SUMS > message
              { printf '\060\052\060\005\006\003\053\145\160\003\041\000'; printf '%s' "$key" | openssl base64 -d -A; } > key.der
              signed=
              while read -r line || [ -n "$line" ]; do
                printf '%s' "$line" | openssl base64 -d -A > signature
                openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey key.der -in message -sigfile signature > /dev/null 2>&1 && signed=1
              done < SHA256SUMS.sig
              [ -n "$signed" ] || { echo "SHA256SUMS of $1 is not signed by Sunrise" >&2; exit 1; }
              grep " $tool\$" SHA256SUMS | sha256sum -c -
              tar -xJf "$tool"
              install -Dm755 cargo-sunrise-mod "$HOME/.local/bin/cargo-sunrise-mod" )
          }

          install_from "mod-tool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the mod against the pinned game
        run: cargo sunrise-mod build

      - name: Check the package
        run: |
          cargo sunrise-mod check
          build=$(sed -n 's/^sunrise = "\([0-9a-f]\{40\}\)"/\1/p' sunrise-mod.toml)
          cargo sunrise-mod check target/sunrise-mod/motion_blur.smod --build "$build"

      # `run` stages the game with the mod under target/sunrise-mod/run/app before starting it.
      # Here the game only prints its --help and exits; the staged folder is what we keep.
      - name: Stage the game with the mod
        run: |
          mkdir -p "$RUNNER_TEMP/no-resources"
          timeout 120 cargo sunrise-mod run --resources "$RUNNER_TEMP/no-resources" -- --help > /dev/null || true
          test -f target/sunrise-mod/run/app/native-mods.json
          ls -la target/sunrise-mod/run/app

      - uses: actions/upload-artifact@v4
        with:
          name: motion-blur
          path: |
            target/sunrise-mod/motion_blur.smod
            Cargo.lock

      - uses: actions/upload-artifact@v4
        with:
          name: game-with-motion-blur-linux
          path: target/sunrise-mod/run/app
          retention-days: 3
